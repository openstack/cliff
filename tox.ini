[tox]
minversion = 4.28.0
envlist = py3,pep8

[testenv]
description =
  Run unit tests.
setenv =
  OS_STDOUT_CAPTURE=1
  OS_STDERR_CAPTURE=1
  OS_TEST_TIMEOUT=60
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
dependency_groups =
  test
commands =
  stestr run {posargs}
  stestr slowest

[testenv:cover]
description =
  Run unit tests and generate coverage report.
setenv =
  {[testenv]setenv}
  PYTHON=coverage run --source cliff --parallel-mode
deps =
  coverage>=5.0
commands =
  stestr run {posargs}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml

[testenv:pep8]
description =
  Run style checks.
dependency_groups =
  test
  typing
deps =
  pre-commit
commands =
  pre-commit run -a
  {[testenv:mypy]commands}

[testenv:mypy]
description =
  Run type checks.
dependency_groups =
  test
  typing
commands =
  mypy --cache-dir="{envdir}/mypy_cache" {posargs:cliff}

[testenv:venv]
description =
  Run specified command in a virtual environment with all dependencies installed.
dependency_groups =
  test
  doc
commands = {posargs}

[testenv:docs]
description =
  Build documentation in HTML format.
dependency_groups =
  doc
commands =
  sphinx-build -W --keep-going -b html -j auto doc/source/ doc/build/html

[testenv:releasenotes]
description =
  Build release notes in HTML format.
dependency_groups =
  doc
commands =
  sphinx-build -a -W -E -b html releasenotes/source releasenotes/build/html

[flake8]
application-import-names = cliff
# E203 Black will put spaces after colons in list comprehensions
# E501 Black takes care of line length for us
# W503 Is supposed to be off by default but in the latest pycodestyle isn't.
#      Also, both openstacksdk and Donald Knuth disagree with the rule. Line
#      breaks should occur before the binary operator for readability.
ignore = E203, E501, W503
import-order-style = pep8
show-source = true
exclude = .venv,.git,.tox,dist,doc,*lib/python*,*egg,build

[hacking]
import_exceptions =
  collections.abc
  typing
